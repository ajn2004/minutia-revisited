[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minutia-revisited"
version = "0.1.0"
description = "A reproducible reference reimplementation of MINuTIA localization microscopy"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "MINuTIA Revisited contributors"}]
dependencies = ["numpy>=2.0", "scipy>=1.12", "torch>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
